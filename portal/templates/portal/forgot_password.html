{% extends 'portal/public_base.html' %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'portal/css/forgotpassword.css' %}">
{% endblock %}

{% block content %}
<div class="login-section d-flex align-items-center justify-content-center">

    <div class="login-card shadow">

        <h2 class="login-title text-center mb-2">
            Forgot Password
        </h2>

        <p class="login-subtitle text-center mb-4">
            Enter your email address to receive OTP
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Your Registered Email"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-login-main w-100"
            >
                Send OTP
            </button>

        </form>

        <div class="text-center mt-4">

            <a
                href="{% url 'login' %}"
                class="login-page-link"
            >
                Back to Login
            </a>

        </div>

    </div>

</div>
{% endblock %}
