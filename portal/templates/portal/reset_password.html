{% extends 'portal/public_base.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'portal/css/login.css' %}">

<!-- BOOTSTRAP ICONS -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
{% endblock %}

{% block content %}
<div class="login-section d-flex align-items-center justify-content-center">

    <div class="login-card shadow">

        <h2 class="login-title text-center mb-2">
            Reset Password
        </h2>

        <p class="login-subtitle text-center mb-4">
            Create a new password for your verified account
        </p>

        <form method="POST" autocomplete="off">

            {% csrf_token %}

            <!-- NEW PASSWORD -->
            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="new_password"
                        id="new-password-field"
                        class="form-control"
                        placeholder="Enter New Password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password-btn"
                        onclick="toggleNewPassword()"
                    >
                        <i
                            id="new-password-icon"
                            class="bi bi-eye-fill"
                        ></i>
                    </button>

                </div>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm-password-field"
                        class="form-control"
                        placeholder="Confirm Password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password-btn"
                        onclick="toggleConfirmPassword()"
                    >
                        <i
                            id="confirm-password-icon"
                            class="bi bi-eye-fill"
                        ></i>
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="btn btn-login-main w-100"
            >
                Reset Password
            </button>

        </form>

        <div class="text-center mt-4">

            <a
                href="{% url 'login' %}"
                class="login-page-link"
            >
                Back to Login
            </a>

        </div>

    </div>

</div>

<script>

    function toggleNewPassword() {

        const passwordField = document.getElementById(
            'new-password-field'
        );

        const toggleIcon = document.getElementById(
            'new-password-icon'
        );

        if (passwordField.type === 'password') {

            passwordField.type = 'text';

            toggleIcon.classList.remove(
                'bi-eye-fill'
            );

            toggleIcon.classList.add(
                'bi-eye-slash-fill'
            );

        } else {

            passwordField.type = 'password';

            toggleIcon.classList.remove(
                'bi-eye-slash-fill'
            );

            toggleIcon.classList.add(
                'bi-eye-fill'
            );
        }
    }

    function toggleConfirmPassword() {

        const passwordField = document.getElementById(
            'confirm-password-field'
        );

        const toggleIcon = document.getElementById(
            'confirm-password-icon'
        );

        if (passwordField.type === 'password') {

            passwordField.type = 'text';

            toggleIcon.classList.remove(
                'bi-eye-fill'
            );

            toggleIcon.classList.add(
                'bi-eye-slash-fill'
            );

        } else {

            passwordField.type = 'password';

            toggleIcon.classList.remove(
                'bi-eye-slash-fill'
            );

            toggleIcon.classList.add(
                'bi-eye-fill'
            );
        }
    }

</script>
{% endblock %}
