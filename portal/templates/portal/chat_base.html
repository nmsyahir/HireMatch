{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Chat
        {% endblock %}
    </title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- BASE CSS -->
    <link
        rel="stylesheet"
        href="{% static 'portal/css/base.css' %}"
    >

    <!-- EXTRA CSS -->
    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <nav class="navbar bg-white shadow-sm py-3 chat-site-nav">
        <div class="container chat-site-nav-inner">
            <a class="navbar-brand brand-logo" href="{% if current_user.role == 'employer' %}{% url 'employer_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}">
                <span class="logo-job">Hire</span>
                <span class="logo-portal">Match</span>
            </a>
            <a href="{% url 'chat_list' %}" class="chat-messages-link">
                <i class="bi bi-chat-dots"></i>
                Messages
            </a>
        </div>
    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
