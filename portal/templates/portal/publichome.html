{% extends 'portal/public_base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPortal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'portal/css/home.css' %}">
    {% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand brand-logo" href="{% url 'public_home' %}">
            Jobs <span>Lah</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'public_jobs' %}">Search Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'public_companies' %}">Explore Companies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'public_about' %}">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'public_contact' %}">Contact Us</a>
                </li>
            </ul>

            <div class="d-flex gap-2">
                <a href="{% url 'signup' %}" class="btn btn-signup">Sign Up</a>
                <a href="{% url 'login' %}" class="btn btn-login">Login</a>
            </div>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer-section mt-5">
    <div class="container py-4 text-center">
        <p class="mb-0">© 2026 JobPortal All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
